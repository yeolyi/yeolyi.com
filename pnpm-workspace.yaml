packages:
  - apps/*
  - packages/*

# 앱과 패키지가 같은 React 하나를 쓰게 버전을 한곳에서 정한다(두 벌이면 훅이 깨진다).
catalog:
  react: ^19.3.0
  react-dom: ^19.3.0
  "@types/react": ^19.2.9
  "@types/react-dom": ^19.2.3

allowBuilds:
  core-js: true
  esbuild: true
  sharp: true

patchedDependencies:
  micromark-core-commonmark@2.0.3: patches/micromark-core-commonmark@2.0.3.patch
