      @font-face {
        font-family: "KyoboHand";
        src: url("/pangyo/fonts/KyoboHandwriting2025lyb.otf") format("opentype");
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: #000;
      }
      #strip {
        max-width: 760px;
        margin: 0 auto;
        padding: 24px 0 80px;
      }
      .panel {
        position: relative;
        margin: 0 8px 42px;
      }
      .panel img {
        width: 100%;
        height: auto;
        display: block;
        background: #fff;
      }
      .b {
        position: absolute;
        box-sizing: border-box;
        line-height: 1.28;
        word-break: keep-all;
        cursor: move;
        user-select: none;
        touch-action: none;
      }
      .b.dragging {
        outline: 2px dashed #09f;
        opacity: 0.85;
      }
      .speech,
      .thought,
      .shout,
      .sys {
        background: #fff;
        border: 2.5px solid #111;
        color: #111;
        padding: 8px 12px;
        font-family: "KyoboHand", "Nanum Pen Script", cursive;
        font-size: 1.5rem;
        text-align: center;
      }
      .speech {
        border-radius: 20px;
      }
      .thought {
        border-radius: 2px;
      } /* 속마음/나레이션: 손글씨 사각 박스 */
      .shout {
        /* 외침: 대사와 같은 굵기/크기, 두꺼운 보더로만 구분 */
        border-width: 4px;
        border-radius: 6px;
        transform: none;
        box-shadow: none;
        font-family: "Pretendard", sans-serif;
        font-weight: 500;
        font-size: 1.02rem;
      }
      .sys {
        border-radius: 2px;
        font-family: "Gothic A1", sans-serif;
        font-weight: 800;
        font-size: 1.05rem;
      }
      .sfx {
        color: #111;
        font-family: "KyoboHand", "Nanum Pen Script", cursive;
        font-weight: bold;
        -webkit-text-stroke: 1.5px #111;
        background: none;
        border: none;
        text-shadow:
          2px 2px 0 #fff,
          -2px -2px 0 #fff,
          2px -2px 0 #fff,
          -2px 2px 0 #fff;
      }
      .sign {
        /* 간판/환경 문자 */
        color: #111;
        background: none;
        border: none;
        text-align: center;
        font-family: "Pretendard", sans-serif;
        font-weight: 700;
        letter-spacing: 0.08em;
      }
      .lcd {
        /* 전광판 디지털 숫자 */
        color: #fff;
        background: none;
        border: none;
        text-align: center;
        font-family: "VT323", monospace;
        letter-spacing: 0.06em;
      }
      .credit {
        color: #888;
        font-family: "Gothic A1", sans-serif;
        font-size: 0.85rem;
        text-align: center;
        margin-top: 30px;
      }
      .missing {
        color: #f66;
        font-family: monospace;
        padding: 40px;
        text-align: center;
        border: 1px dashed #555;
      }
