<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>정음</title>
<style>
  :root {
    --paper: #f6f1e7; --ink: #1d1b18; --muted: #7a7266; --line: #e3dccd; --seal: #c8321f; --card: #fffdf8;
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #1b1a17; --ink: #f1ece2; --muted: #a39b8e; --line: #34312b; --card: #24221e; --seal: #e0553f; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; width: 300px; background: var(--paper); color: var(--ink);
    font: 14px/1.5 "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  }
  header { display: flex; align-items: center; gap: 12px; padding: 18px 18px 14px; border-bottom: 1px solid var(--line); }
  .seal {
    width: 40px; height: 40px; flex: none; border-radius: 8px; background: var(--seal); color: #fff;
    display: grid; place-items: center; font: 700 22px/1 "Nanum Myeongjo", "AppleMyungjo", "Batang", serif;
  }
  h1 { margin: 0; font-size: 17px; font-weight: 800; letter-spacing: -0.02em; }
  .sub { margin: 0; color: var(--muted); font-size: 12px; }
  .demo {
    margin: 14px 18px 4px; padding: 10px 12px; background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    font-size: 13px;
  }
  .demo .from { color: var(--muted); }
  .demo .to { font-weight: 700; }
  ul { list-style: none; margin: 8px 0 0; padding: 0 6px 10px; }
  li { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 12px; border-radius: 8px; }
  li label { cursor: pointer; flex: 1; }
  li small { display: block; color: var(--muted); font-size: 12px; }
  li.disabled { opacity: .45; }
  .sw { position: relative; width: 38px; height: 22px; flex: none; }
  .sw input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
  .sw span { position: absolute; inset: 0; border-radius: 99px; background: var(--line); transition: background .15s; }
  .sw span::after {
    content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%;
    background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .15s;
  }
  .sw input:checked + span { background: var(--seal); }
  .sw input:checked + span::after { transform: translateX(16px); }
  .sw input:focus-visible + span { outline: 2px solid var(--seal); outline-offset: 2px; }
  footer { padding: 10px 18px 14px; color: var(--muted); font-size: 11px; border-top: 1px solid var(--line); }
</style>
</head>
<body>
  <header>
    <div class="seal" aria-hidden="true">한</div>
    <div>
      <h1>정음</h1>
      <p class="sub">모든 외국 글자를 한글 소리로</p>
    </div>
  </header>

  <div class="demo"><span class="from">Hello, world!</span> → <span class="to">헬로, 월드!</span></div>

  <ul>
    <li>
      <label for="enabled">한글로 바꾸기<small>모든 사이트에 적용</small></label>
      <span class="sw"><input type="checkbox" id="enabled"><span></span></span>
    </li>
    <li id="siteRow">
      <label for="site">이 사이트에서도<small id="host">이 탭에서는 쓸 수 없어요</small></label>
      <span class="sw"><input type="checkbox" id="site"><span></span></span>
    </li>
    <li>
      <label for="numbers">숫자도 읽기<small>2026 → 이천이십육</small></label>
      <span class="sw"><input type="checkbox" id="numbers"><span></span></span>
    </li>
  </ul>

  <footer>영어 · 일본어 · 중국어 · 한자 · 라틴 문자 지원 · 끄면 원래대로 돌아와요</footer>
  <script src="popup.js"></script>
</body>
</html>
