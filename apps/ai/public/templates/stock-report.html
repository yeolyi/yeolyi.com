<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>Company Report</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script>
// ▼ 이 R 객체의 값만 바꾼다. 아래 HTML·CSS·스크립트는 그대로 둔다.
const R = {
  broker: "가상의 증권사 이름(이 사람의 특징을 비튼 것)", date: "2026.10.17",
  name: "회사 이름", code: "의미 있는 6자리",
  headline: "리포트 제목. 짧은 대구",
  lead: "요약 첫 줄(굵게). 숫자 두 개 + 한 줄 결론",
  summary: "요약 3~4문장. 마지막 문장은 투자의견",
  sections: [
    ["핵심 사업: 결론이 된 소제목", "본문 3~5문장. 숫자와 실제 인용"],
    ["경쟁력: …", "…"],
    ["신사업이든 무엇이든 하나 더: …", "…"],
  ],
  forecast: { unit: "(단위: 회, 2027E는 연환산)", est: "2027E", rows: [
    ["지표(말버릇·습관)", "누적", "내년 예상", "코멘트 한 줄"],
    // 5~6줄
  ], source: "자료: 출처(대화 기록 기간), 증권사 리서치센터" },
  rating: "BUY | HOLD | SELL", ratingMark: "(M)", ratingKo: "매수 | 보유 | 매도",
  target: "0원", targetMark: "(U | D | M)", prevTarget: "0원", price: "0원", priceDate: "MM/DD", upside: "+0.0%",
  targetNote: "목표주가: 계산식. 직전: 계산식",
  stock: [["시가총액", "…"], ["상장일", "첫 대화 날짜"], ["발행주식수", "보낸 메시지 수"], ["일평균 거래량", "하루 평균 메시지"], ["52주 최고 (M/D)", "가장 많이 보낸 날"]],
  returns: { head: ["1M", "3M", "nM"], abs: ["-0.0", "-0.0", "+0.0"], note: "기준 한 줄" },
  monthly: { x: ["YY.MM"], y: [0] },
  risks: [
    ["위험 이름", "근거 숫자와 인용, 한 줄 결론", "치명"],
    // 4~5줄. 등급은 치명·높음·중간·관찰 중 하나
  ],
  weekly: { note: "주간 발화 건수, 점선은 4주 이동평균",
    y: [0],
    ticks: [[0, "YY.MM"]],
    marks: [[0, "사건 이름", "up"], [0, "-00%", "dn"]] },
  words: { note: "Top 10, 누적 발화", hi: "막대 중 검게 칠할 말버릇", data: [["말버릇", 0]] },
  opinion: { buy: "매수 근거 한 문장", sell: "매도 근거 한 문장", end: "결론 한 문장" },
};
// ▲ 여기까지
</script>
<style>
:root{--c:#e65817;--k:#1c1917;--l:#e7e5e4;--m:#78716c;--s:#f5f5f4;--g:#c9c5c2}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#e7e5e4;font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--k);font-size:12px;line-height:1.6;word-break:keep-all}
.pg{width:210mm;height:297mm;margin:16px auto;background:#fff;padding:12mm 13mm 9mm;display:flex;flex-direction:column}
@page{size:A4;margin:0}@media print{body{background:#fff}.pg{margin:0;break-after:page}}
.hd{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2.5px solid var(--k);padding-bottom:2.5mm}
.hd .l{font-size:13px;font-weight:600}.hd .l span{font-weight:400;color:var(--m);margin-left:8px}
.logo{font-size:17px;font-weight:800;letter-spacing:-.3px}.logo:before{content:"";display:inline-block;width:11px;height:11px;background:var(--c);margin-right:5px}
h1{margin-top:6mm;font-size:32px;font-weight:800;letter-spacing:-1px;line-height:1.2;border-left:5px solid var(--c);padding-left:3mm}h1 small{font-size:17px;font-weight:500;margin-left:6px}
.hl{font-size:21px;font-weight:700;margin:3mm 0 5mm}
.cols{display:grid;grid-template-columns:1fr 63mm;gap:8mm;flex:1}
.sum{background:var(--s);padding:4mm 5mm}.sum b{display:block;font-size:13.5px;margin-bottom:1mm}
h3{font-size:14px;margin:5mm 0 1.2mm}
p{text-align:justify}
.tt{display:flex;justify-content:space-between;align-items:baseline;margin-top:6mm;border-bottom:1.5px solid var(--k);padding-bottom:1.2mm}.tt b{font-size:13.5px}.tt span{font-size:10px;color:var(--m)}
table{width:100%;border-collapse:collapse}
.ft th{font-weight:600;text-align:left;padding:1.5mm 1.5mm;border-bottom:1px solid var(--k)}.ft td{padding:1.4mm 1.5mm;border-bottom:1px solid var(--l)}.ft .n{text-align:right;font-variant-numeric:tabular-nums}.ft td:last-child{color:var(--m)}
.src{font-size:10px;color:var(--m);margin-top:1.5mm}
.rate{background:var(--k);color:#fff;text-align:center;font-size:30px;font-weight:800;padding:2.5mm 0;letter-spacing:.5px}.rate small{font-size:13px;font-weight:400;margin-left:4px}
.kv td{padding:1.3mm 0;border-bottom:1px solid var(--l)}.kv td+td{text-align:right;font-variant-numeric:tabular-nums}
.kv tr.big td{font-size:14px;font-weight:700;padding-top:2.5mm}.kv tr.big td+td{color:var(--c)}
.side .note{font-size:10px;color:var(--m);margin-top:1.2mm;line-height:1.5}
.side h4{font-size:13px;margin-top:5mm;border-bottom:1.5px solid var(--k);padding-bottom:1.2mm}
.rt td{padding:1.3mm 0;text-align:right;border-bottom:1px solid var(--l)}.rt td:first-child{text-align:left}
.up{color:var(--c)}
.bt{border-top:1px solid var(--g);padding-top:2mm;display:flex;justify-content:space-between;font-size:10px;color:var(--m);margin-top:4mm}
h2{display:flex;justify-content:space-between;align-items:baseline;font-size:17px;margin-top:6mm;border-bottom:1.5px solid var(--k);padding-bottom:1.5mm}h2 span{font-size:10.5px;font-weight:400;color:var(--m)}
.rk td{padding:1.8mm 3mm;border-bottom:1px solid var(--l);vertical-align:top}.rk td:first-child{background:var(--s);font-weight:700;width:30mm}.rk td:last-child{width:17mm;text-align:center;font-weight:700;font-size:11px}
.lv0{background:var(--c);color:#fff}.lv1{background:#f08a55;color:#fff}.lv2{background:#fdece2;color:var(--c)}.lv3{background:var(--s);color:var(--m)}
svg{display:block;width:100%;overflow:visible}svg text{font-family:inherit;font-size:9px;fill:var(--m)}
.op{display:grid;grid-template-columns:42mm 1fr;border:1.5px solid var(--k);margin-top:3mm}.op .r{background:var(--k);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:30px;font-weight:800}.op .r small{font-size:11px;font-weight:400;opacity:.7}.op div+div{padding:3.5mm 5mm;font-size:12.5px;line-height:1.75}
</style></head><body>
<div id="out"></div>
<script>
const h=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
const num=s=>Number(String(s).replace(/[^\d.-]/g,""));
const sign=v=>String(v).trim().startsWith("+")?`<span class="up">${h(v)}</span>`:h(v);
const fmt=n=>n.toLocaleString("ko-KR");
// 눈금 간격: 4칸 이하가 되는 가장 작은 1·2·2.5·5 배수
function nice(max){max=Math.max(max,1);const e=10**Math.floor(Math.log10(max)-1);return [1,2,2.5,5,10,20,25,50,100].map(f=>f*e).find(st=>Math.ceil(max/st)<=4)}
// 꺾은선: c={y,ticks:[[i,label]],marks:[[i,label,"up"|"dn"]]}, ma=이동평균 창
function line(c,W,H,{ma=0,area=false,peak=false}={}){const L=34,T=14,B=18,st=nice(Math.max(...c.y)),top=st*Math.ceil(Math.max(...c.y)/st),n=c.y.length;
 const X=i=>L+i*(W-L-6)/(n-1),Y=v=>T+(1-v/top)*(H-T-B);let g="";
 for(let v=0;v<=top;v+=st)g+=`<line x1="${L}" x2="${W}" y1="${Y(v)}" y2="${Y(v)}" stroke="#e7e5e4"/><text x="${L-6}" y="${Y(v)+3}" text-anchor="end">${fmt(v)}</text>`;
 const pts=c.y.map((v,i)=>`${X(i)},${Y(v)}`).join(" ");
 if(area)g+=`<polygon fill="#f5f5f4" points="${X(0)},${Y(0)} ${pts} ${X(n-1)},${Y(0)}"/>`;
 if(ma){const m=c.y.map((_,i)=>i<ma-1?null:c.y.slice(i-ma+1,i+1).reduce((a,b)=>a+b)/ma);g+=`<polyline fill="none" stroke="#e65817" stroke-width="1.4" stroke-dasharray="4 3" points="${m.map((v,i)=>v==null?"":`${X(i)},${Y(v)}`).join(" ")}"/>`}
 g+=`<polyline fill="none" stroke="#1c1917" stroke-width="1.8" points="${pts}"/>`;
 const marks=c.marks||(peak?[[c.y.indexOf(Math.max(...c.y)),fmt(Math.max(...c.y)),"up"]]:[]);
 // up 은 점 위 가운데, dn 은 점 옆(기본 오른쪽, 넷째 값 "l" 이면 왼쪽)
 for(const[i,t,k,side]of marks){const up=k==="up",col=up?"#e65817":"#1c1917",x=X(i),y=Y(c.y[i]);
  const tx=up?x:side==="l"?x-6:x+6,ty=up?y-8:y+3,anc=up?"middle":side==="l"?"end":"start";
  g+=`<circle cx="${x}" cy="${y}" r="3.2" fill="${col}"/><text x="${tx}" y="${ty}" text-anchor="${anc}" style="fill:${col};font-weight:700;font-size:10px">${h(t)}</text>`}
 const ticks=c.ticks||c.x.map((x,i)=>[i,x]).filter((_,i)=>i%3===0);
 for(const[i,t]of ticks)g+=`<text x="${X(i)}" y="${H-3}" text-anchor="middle">${h(t)}</text>`;
 return `<svg viewBox="0 0 ${W} ${H}">${g}</svg>`}
function bars(w,W,H){const L=34,T=16,B=22,max=Math.max(...w.data.map(d=>d[1])),st=nice(max),top=st*Math.ceil(max/st),n=w.data.length,bw=(W-L)/n;
 const Y=v=>T+(1-v/top)*(H-T-B);let g="";
 for(let v=0;v<=top;v+=st)g+=`<line x1="${L}" x2="${W}" y1="${Y(v)}" y2="${Y(v)}" stroke="#e7e5e4"/><text x="${L-6}" y="${Y(v)+3}" text-anchor="end">${fmt(v)}</text>`;
 w.data.forEach(([t,v],i)=>{const x=L+i*bw+bw*.2,col=v===max?"#e65817":t===w.hi?"#1c1917":"#c9c5c2";
  g+=`<rect x="${x}" y="${Y(v)}" width="${bw*.6}" height="${Y(0)-Y(v)}" fill="${col}"/><text x="${x+bw*.3}" y="${Y(v)-4}" text-anchor="middle">${fmt(v)}</text><text x="${x+bw*.3}" y="${H-5}" text-anchor="middle" style="fill:#1c1917;font-size:11px;font-weight:600">${h(t)}</text>`});
 return `<svg viewBox="0 0 ${W} ${H}">${g}</svg>`}
const LV=["치명","높음","중간","관찰"];
const kv=rows=>rows.map(([k,v])=>`<tr><td>${h(k)}</td><td>${h(v)}</td></tr>`).join("");
const logo=`<div class="logo">${h(R.broker)}</div>`;
const render=k=>{document.getElementById("out").innerHTML=`
<div class="pg">
 <div class="hd"><div class="l">Company Report<span>${h(R.date)}</span></div>${logo}</div>
 <h1>${h(R.name)}<small>(${h(R.code)})</small></h1>
 <div class="hl">${h(R.headline)}</div>
 <div class="cols fit">
  <div>
   <div class="sum"><b>${h(R.lead)}</b><p>${h(R.summary)}</p></div>
   ${R.sections.map(([t,b])=>`<h3>${h(t)}</h3><p>${h(b)}</p>`).join("")}
   <div class="tt"><b>Forecasts and valuations</b><span>${h(R.forecast.unit)}</span></div>
   <table class="ft"><tr><th>지표</th><th class="n">누적 실적</th><th class="n">${h(R.forecast.est)}</th><th>코멘트</th></tr>
   ${R.forecast.rows.map(r=>`<tr><td>${h(r[0])}</td><td class="n">${h(r[1])}</td><td class="n">${h(r[2])}</td><td>${h(r[3])}</td></tr>`).join("")}</table>
   <div class="src">${h(R.forecast.source)}</div>
  </div>
  <div class="side">
   <div class="rate">${h(R.rating)}<small>${h(R.ratingMark)}</small></div>
   <table class="kv"><tr class="big"><td>목표주가</td><td>${h(R.target)} ${h(R.targetMark)}</td></tr>
   ${kv([["직전 목표주가",R.prevTarget],[`현재주가 (${R.priceDate})`,R.price]])}<tr><td>상승여력</td><td>${sign(R.upside)}</td></tr></table>
   <div class="note">${h(R.targetNote)}</div>
   <h4>Stock Data</h4><table class="kv">${kv(R.stock)}</table>
   <h4>주가수익률 (%)</h4><table class="rt"><tr><td></td>${R.returns.head.map(x=>`<td>${h(x)}</td>`).join("")}</tr><tr><td>절대</td>${R.returns.abs.map(x=>`<td>${sign(x)}</td>`).join("")}</tr></table>
   <div class="note">${h(R.returns.note)}</div>
   <h4>Price Trend (월 거래량)</h4><div style="margin-top:3mm">${line(R.monthly,230,115,{peak:true})}</div>
  </div>
 </div>
 <div class="bt"><span>${h(R.broker)} 리서치센터</span><span>양식 이성열 · @yeol.dev　　1</span></div>
</div>
<div class="pg">
 <div class="hd"><div class="l">${h(R.name)}<span>(${h(R.code)})</span></div>${logo}</div>
 <div class="fit">
 <h2>위험 요인<span>Risk Factors</span></h2>
 <table class="rk">${R.risks.map(([k,t,l])=>`<tr><td>${h(k)}</td><td>${h(t)}</td><td class="lv${LV.indexOf(l)}">${h(l)}</td></tr>`).join("")}</table>
 <h2>주가 추이<span>${h(R.weekly.note)}</span></h2>
 <div style="margin-top:5mm">${line(R.weekly,680,215*k,{ma:4,area:true})}</div>
 <h2>말버릇별 거래량<span>${h(R.words.note)}</span></h2>
 <div style="margin-top:5mm">${bars(R.words,680,150*k)}</div>
 <h2>투자의견<span>Recommendation</span></h2>
 <div class="op"><div class="r">${h(R.rating)}<small>${h(R.ratingKo)}</small></div><div><b>매수 근거.</b> ${h(R.opinion.buy)}<br><b>매도 근거.</b> ${h(R.opinion.sell)}<br><b>결론.</b> ${h(R.opinion.end)}</div></div>
 </div>
 <div style="flex:1"></div>
 <div class="bt"><span>본 조사분석자료는 대화 기록을 바탕으로 작성되었으며, 투자 결과에 대한 법적 책임 소재의 증빙자료로 사용될 수 없습니다.</span><span>2</span></div>
</div>`};
// 내용이 길어 A4 를 넘치면 2쪽 그래프부터 낮추고, 그래도 넘치는 쪽은 글자를 조금씩 줄인다
let k=1;render(k);const pages=()=>document.querySelectorAll(".pg"),over=pg=>pg.scrollHeight>pg.clientHeight+1;
while(over(pages()[1])&&k>.6){k-=.05;render(k)}
for(const pg of pages()){const f=pg.querySelector(".fit");for(let z=1;over(pg)&&z>.8;){z-=.02;f.style.zoom=z}}
</script></body></html>
